[project]
name = "inventory-management-system"
version = "1.0.0"
description = "AI-powered Inventory Management System with real-time analytics, demand forecasting, and smart reordering."
authors = [{ name = "InventoryAI Team" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "flet==0.84.0",
    "pymongo>=4.16.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "prophet>=1.3.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "reportlab>=4.4.10",
    "bcrypt>=5.0.0",
    "flet-datatable2==0.84.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
